<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>草图 01 · 登录页</title>
    <link rel="stylesheet" href="./sketch.css" />
  </head>
  <body>
    <div class="sketch">
      <div class="login">
        <section class="login__brand">
          <div class="login__wordmark">藏書閣</div>
          <div class="login__en">LIBRARY MANAGEMENT</div>
          <div class="login__quote">让每一本书<br />都能被找到。</div>
          <div class="login__rule"></div>
          <div class="login__meta">
            <span>馆藏管理</span>
            <span>借阅流转</span>
            <span>读者档案</span>
          </div>
        </section>

        <section class="login__panel">
          <div class="login__form">
            <h1>欢迎回来</h1>
            <p>登录以继续管理馆藏与借阅</p>
            <div class="field">
              <label>账号</label>
              <div class="input">请输入账号（3–32 位）</div>
            </div>
            <div class="field">
              <label>密码</label>
              <div class="input">请输入密码（6–64 位）</div>
            </div>
            <button type="button" class="login__submit">登 录</button>
            <div class="login__hint">账号由系统管理员分配</div>
          </div>
        </section>
      </div>
      <div class="sketch__tag">草图 01 / 登录页 · 56 : 44 分栏 · 主色 #1F3A5F</div>
    </div>
  </body>
</html>
