spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/book_library?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      # 初始化大小、最小、最大
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接等待超时时间（毫秒）
      max-wait: 60000
      # 检测连接是否有效的 SQL
      validation-query: SELECT 1
      # 申请连接时检测
      test-on-borrow: false
      # 归还连接时检测
      test-on-return: false
      # 空闲时检测（建议开启）
      test-while-idle: true
      # 检测间隔（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 监控统计拦截的 filters（stat:监控统计、wall:防御 SQL 注入）
      filters: stat,wall
      # 通过 connectProperties 打开 mergeSql 功能；慢 SQL 记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
      # 合并多个 DruidDataSource 的监控数据
      use-global-data-source-stat: true
      # Druid 监控页面（/druid/*）
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        # 仅本机可访问
        allow: 127.0.0.1
        # 禁用"重置全部"按钮，避免误清空监控数据
        reset-enable: false
      # Web 请求统计（Spring 监控、URI 监控、Session 监控依赖此过滤器）
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: true
        session-stat-max-count: 1000

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类别名包
  type-aliases-package: com.libraryadmin.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL 日志到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：自增（与表结构 AUTO_INCREMENT 对齐）
      id-type: auto
      # 逻辑删除字段（book 表的 is_deleted）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别（dev 环境更详细）
logging:
  level:
    com.libraryadmin: debug
    com.baomidou.mybatisplus: debug
