spring:
  config:
    # 本地 .env 不随代码提交；从项目根目录或模块目录启动都可加载
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # 连接信息通过环境变量注入；本地开发至少需要设置 DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/book_library?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    druid:
      # Druid 监控默认关闭；需要时设置 DRUID_STAT_ENABLED=true，
      # 并通过 DRUID_USERNAME / DRUID_PASSWORD 注入登录凭据
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:}
        login-password: ${DRUID_PASSWORD:}
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: true
        session-stat-max-count: 1000

# 开发环境打印 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.libraryadmin: debug
    com.baomidou.mybatisplus: debug
