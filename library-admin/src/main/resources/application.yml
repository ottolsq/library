spring:
  application:
    name: library-admin
  profiles:
    active: @env@
  # Redis：登录态缓存，所有环境共用，连接信息可由环境变量覆盖
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 无密码时留空；有密码时通过 REDIS_PASSWORD 注入
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  # 数据源公共配置：驱动、连接池；各环境只覆盖 url / username / password
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # stat 监控统计，wall 防御 SQL 注入
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
      use-global-data-source-stat: true

# MyBatis-Plus 公共配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.libraryadmin.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

# 跨域白名单：显式列出前端来源，不使用通配符
security:
  cors:
    # 5173 为 Vite 开发服务器，4173 为生产构建预览服务器
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
  jwt:
    # 所有环境都必须通过 JWT_SECRET 环境变量注入，未配置时启动失败
    secret: ${JWT_SECRET}
